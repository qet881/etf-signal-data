name: Daily ETF Signal Update

on:
  schedule:
    - cron: '15 7,11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install finance-datareader yfinance pandas python-dateutil pytz requests lxml beautifulsoup4

      - name: Generate signals.json
        run: python update_signals.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signals.json
          git diff --staged --quiet || (git commit -m "chore: auto-update ETF signals" && git push)
